name: ci

on:
  push:
  pull_request:

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - { cxx: g++,     flags: "" }
          - { cxx: g++-14,  flags: "" }
          - { cxx: clang++, flags: "--static" }
          - { cxx: g++,     flags: "--without-ssl --build-type Debug" }
    name: build (${{ matrix.cxx }} ${{ matrix.flags }})
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
        with:
          submodules: recursive
      - name: Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y ninja-build libssl-dev zlib1g-dev libxml2-dev python3-zmq python3-protobuf python3-numpy
      - name: Install
        env:
          CXX: ${{ matrix.cxx }}
        run: ./install.sh --prefix "$HOME/forgecpp" --tests --examples ${{ matrix.flags }}
      - name: Smoke-test the example applications
        working-directory: build/forgecpp/examples
        run: |
          set -euo pipefail
          has() {  # has <pattern> <command...>: the command succeeds and prints the pattern
            local pattern=$1; shift
            local out
            out=$("$@")
            grep -q -- "$pattern" <<<"$out"
          }
          run_app() {  # run_app <port> <command...>: start, probe over HTTP, stop with SIGTERM
            local port=$1; shift
            "$@" -D http.port=$port -D log.console=false &
            local pid=$!
            for _ in $(seq 100); do curl -fs "http://127.0.0.1:$port/health" >/dev/null && break; sleep 0.1; done
            curl -fs "http://127.0.0.1:$port/health"; echo
            curl -fs "http://127.0.0.1:$port/forge/api/state" >/dev/null
            has "forge.js" curl -fs "http://127.0.0.1:$port/forge/"
            kill -TERM $pid
            wait $pid
          }
          ./hello --version
          run_app 18105 ./radio_controller/radio-controller --backend sim -D http.enabled=true -D radio.sample_rate_hz=5e6
          run_app 18106 ./spectrum_analyzer/spectrum-analyzer -c spectrum_analyzer/spectrum-analyzer.toml --backend sim
          ./spectrum_analyzer/spectrum-analyzer -c spectrum_analyzer/spectrum-analyzer.toml --backend sim \
            -D http.port=18107 -D log.console=false -D analyzer.span_hz=20e6 &
          pid=$!
          for _ in $(seq 100); do curl -fs http://127.0.0.1:18107/health >/dev/null && break; sleep 0.1; done
          curl -fs http://127.0.0.1:18107/ -o /tmp/sa.html && grep -q "<title>Spectrum analyzer</title>" /tmp/sa.html
          for _ in $(seq 100); do curl -fs http://127.0.0.1:18107/api/frame -o /tmp/sa.json && grep -q '"live"' /tmp/sa.json && break; sleep 0.1; done
          curl -fs -X POST http://127.0.0.1:18107/forge/api/controls/peak_search -d '{}' >/dev/null
          has true curl -fs http://127.0.0.1:18107/forge/api/controls/m1_on
          curl -fs http://127.0.0.1:18107/api/trace.csv -o /tmp/sa.csv && head -1 /tmp/sa.csv | grep -q frequency_hz
          test "$(wc -l < /tmp/sa.csv)" -eq 1002
          curl -fs http://127.0.0.1:18107/api/iq.cs16 -o /tmp/sa.cs16 && test -s /tmp/sa.cs16
          kill -TERM $pid
          wait $pid
          # forge-hub first: the two daemons below register with it by themselves
          mkdir -p /tmp/hub
          ../hub/forge-hub -c ../../../hub/config/forge-hub.toml -D http.port=18110 -D log.console=false \
            -D registry.state_file=/tmp/hub/registry.json -D registry.log_dir=/tmp/hub/logs &
          hub=$!
          for _ in $(seq 100); do curl -fs http://127.0.0.1:18110/health >/dev/null && break; sleep 0.1; done
          # both on one board: the analyzer on RX2 of radio-controller (simulated AD9361)
          ./radio_controller/radio-controller -c radio_controller/radio-controller.toml --backend sim \
            -D http.port=18108 -D log.console=false -D radio.sample_rate_hz=5e6 &
          rc=$!
          ./spectrum_analyzer/spectrum-analyzer -c spectrum_analyzer/spectrum-analyzer.toml --backend radio \
            -D http.port=18109 -D log.console=false &
          pid=$!
          for _ in $(seq 150); do curl -fs http://127.0.0.1:18109/api/frame -o /tmp/sa.json && grep -q '"fixed":true' /tmp/sa.json && break; sleep 0.1; done
          grep -q '"fixed":true' /tmp/sa.json
          has '"value":\[2\]' curl -fs http://127.0.0.1:18108/forge/api/controls/tap_channels
          # forge.v1: forgectl over ZeroMQ and HTTP, the audit trail, streams, telnet, Python clients
          ctl="$HOME/forgecpp/bin/forgectl"
          has radio-controller "$ctl" -e tcp://127.0.0.1:5557 info
          has 2412 "$ctl" -e tcp://127.0.0.1:5557 set rx_lo_mhz 2412
          has rx_lo_mhz "$ctl" -e tcp://127.0.0.1:5557 audit
          has 2412 "$ctl" -e http://127.0.0.1:18108 get rx_lo_mhz
          has STATE_OK "$ctl" -e tcp://127.0.0.1:5567 health
          has sa.v1.Spectrum "$ctl" -e tcp://127.0.0.1:5567 streams
          has '^sa_sweeps' curl -fs http://127.0.0.1:18109/metrics
          python3 - <<'EOF'
          import socket, time
          s = socket.create_connection(("127.0.0.1", 2323), timeout=5)
          time.sleep(0.5); s.sendall(b"status\r\n"); time.sleep(0.5); s.sendall(b"exit\r\n")
          out = b""
          try:
              while chunk := s.recv(4096): out += chunk
          except socket.timeout:
              pass
          assert b"uptime" in out, out
          EOF
          export FORGE_PYTHONPATH="$HOME/forgecpp/share/forgecpp/python:$PWD/radio_controller/ad936x/python:$PWD/spectrum_analyzer/python"
          export PYTHONDONTWRITEBYTECODE=1
          python3 ../../../examples/radio_controller/clients/rx_capture.py tcp://127.0.0.1:5555 --seconds 0.5 > /tmp/rx.txt
          grep -q "blocks" /tmp/rx.txt
          python3 ../../../examples/spectrum_analyzer/clients/spectrum_watch.py tcp://127.0.0.1:5566 --count 2 > /tmp/sw.txt
          grep -q fixed /tmp/sw.txt
          # forge-hub: both registered, with their ports; a crash is restarted by the policy in [hub]
          for _ in $(seq 100); do
            curl -fs http://127.0.0.1:18110/api/apps -o /tmp/apps.json && grep -q spectrum-analyzer /tmp/apps.json \
              && grep -q radio-controller /tmp/apps.json && break
            sleep 0.1
          done
          has '"http_port":18108' cat /tmp/apps.json
          has '<title>Device</title>' curl -fs http://127.0.0.1:18110/
          kill -KILL $rc
          wait $rc || true
          python3 - "$rc" <<'EOF'
          import json, sys, time, urllib.request
          old = int(sys.argv[1])
          for _ in range(150):
              apps = json.load(urllib.request.urlopen("http://127.0.0.1:18110/api/apps"))["apps"]
              rc = next(a for a in apps if a["app"]["name"] == "radio-controller")
              if rc["state"] == "STATE_RUNNING" and int(rc["app"].get("pid", 0)) not in (0, old):
                  assert rc.get("restarts") == 1, rc
                  open("/tmp/rc2.pid", "w").write(str(rc["app"]["pid"]))
                  break
              time.sleep(0.1)
          else:
              sys.exit("radio-controller was not restarted: %s" % rc)
          EOF
          rc2=$(cat /tmp/rc2.pid)
          kill -TERM $pid $rc2 $hub
          wait $pid
          wait $hub
          for _ in $(seq 100); do kill -0 $rc2 2>/dev/null || break; sleep 0.1; done
          run_app 18101 ./sensor_service -c sensor_service.toml
          run_app 18102 ./pipeline -c pipeline.toml --producers 2
          run_app 18103 ./thermostat -c thermostat.toml -D thermostat.settings_file=/tmp/thermostat.json
          ./thermostat -c thermostat.toml -D http.port=18104 -D log.console=false &
          pid=$!
          for _ in $(seq 100); do curl -fs http://127.0.0.1:18104/health >/dev/null && break; sleep 0.1; done
          has "<title>Thermostat</title>" curl -fs http://127.0.0.1:18104/
          has '"hysteresis":0.5' curl -fs -X PUT http://127.0.0.1:18104/api/settings -d '{"hysteresis": 0.5}'
          test "$(curl -s -o /dev/null -w '%{http_code}' -X PUT http://127.0.0.1:18104/api/settings -d '{"hysteresis": 9}')" = 422
          kill -TERM $pid
          wait $pid
      - name: Scaffold and build an app against the installed package
        run: |
          "$HOME/forgecpp/bin/forgecpp-new" demo -d /tmp
          cmake -S /tmp/demo -B /tmp/demo/build -G Ninja -DCMAKE_PREFIX_PATH="$HOME/forgecpp" -DCMAKE_CXX_COMPILER=${{ matrix.cxx }}
          cmake --build /tmp/demo/build
          ctest --test-dir /tmp/demo/build --output-on-failure
          /tmp/demo/build/demo -c /tmp/demo/config/demo.toml --print-config
      - name: Uninstall
        run: ./install.sh --uninstall --prefix "$HOME/forgecpp" && test -z "$(find "$HOME/forgecpp" -type f)"
