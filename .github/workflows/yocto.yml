name: yocto

# Nightly: build the qemuarm64 image (forgecpp, forge-hub, radio-controller on
# its simulator, spectrum-analyzer) from this checkout and boot it in QEMU
# with the runtime tests (testimage), twice: with meta-oe and meta-python
# (yocto/kas/qemuarm64.yml, a usual BSP) and with poky and this layer only
# (yocto/kas/qemuarm64-poky.yml: the layer's backfill recipes).
#
# A Yocto build needs tens of GB and hours: the job frees the runner's disk and
# keeps downloads and sstate between runs. For a faster, roomier machine set
# the repository variable YOCTO_RUNNER to a self-hosted runner's label.
on:
  schedule:
    - cron: "17 2 * * *"
  workflow_dispatch:

concurrency:
  group: yocto
  cancel-in-progress: false

jobs:
  qemuarm64:
    runs-on: ${{ vars.YOCTO_RUNNER || 'ubuntu-24.04' }}
    timeout-minutes: 360
    strategy:
      fail-fast: false
      max-parallel: 1   # one build at a time: they share the downloads and sstate
      matrix:
        kas: [qemuarm64.yml, qemuarm64-poky.yml]
    env:
      KAS_WORK_DIR: ${{ github.workspace }}/../kas
      DL_DIR: ${{ github.workspace }}/../kas/downloads
      SSTATE_DIR: ${{ github.workspace }}/../kas/sstate-cache
    steps:
      - uses: actions/checkout@v5
        with:
          submodules: recursive
      - name: Free disk space
        if: ${{ !vars.YOCTO_RUNNER }}
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL \
            /usr/local/share/boost /usr/share/swift
          sudo docker image prune --all --force || true
          df -h /
      - name: Build host packages
        run: |
          sudo apt-get update
          sudo apt-get install -y gawk wget git diffstat unzip texinfo gcc build-essential chrpath socat \
            cpio python3 python3-pip python3-pexpect xz-utils debianutils iputils-ping python3-git \
            python3-jinja2 python3-subunit zstd liblz4-tool file locales libacl1 lz4
          sudo locale-gen en_US.UTF-8
          pip3 install --user --break-system-packages kas==4.5
          # Ubuntu 24.04 restricts unprivileged user namespaces, which bitbake uses.
          sudo sysctl kernel.apparmor_restrict_unprivileged_userns=0 || true
          mkdir -p "$KAS_WORK_DIR"
      - uses: actions/cache@v4
        with:
          path: |
            ${{ github.workspace }}/../kas/downloads
            ${{ github.workspace }}/../kas/sstate-cache
          key: yocto-scarthgap-qemuarm64-${{ github.run_id }}
          restore-keys: yocto-scarthgap-qemuarm64-
      - name: Build the image
        env:
          FORGECPP_SRC: ${{ github.workspace }}
          LANG: en_US.UTF-8
        run: ~/.local/bin/kas build yocto/kas/${{ matrix.kas }}
      - name: Boot it in QEMU and run the runtime tests
        env:
          FORGECPP_SRC: ${{ github.workspace }}
          LANG: en_US.UTF-8
        run: ~/.local/bin/kas build yocto/kas/${{ matrix.kas }} -c testimage
      - name: Logs
        if: failure()
        run: |
          # The latest log of each task of this layer's own programs (bitbake has
          # already printed the error of a failed task of any other recipe).
          # The checkout is under .../forgecpp/ too: match the recipe directory.
          find "$KAS_WORK_DIR/build/tmp/work" -regextype posix-extended -newer yocto/kas/${{ matrix.kas }} \
            -regex '.*/tmp/work/[^/]+/(forgecpp|radio-controller)/[^/]+/temp/log\.do_[a-z_]+' |
            head -20 | xargs -r tail -n 80
          find "$KAS_WORK_DIR/build/tmp/log/oeqa" -type f | xargs -r tail -n 200
          df -h /
