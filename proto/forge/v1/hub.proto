// forge-hub: the registry and dashboard of the forgecpp applications on a
// device (optional). Every application tries to register when it starts
// ([hub] in its configuration) and keeps running whether or not a hub
// answers. Restarting is systemd's job (the unit forge_add_app generates);
// the hub shows what systemd does and starts / stops / restarts units on request.
//
//   application --HubRequest{register}-->   hub   [hub].endpoint, REQ/REP, localhost
//   application <--HubReply--------------   hub
//   application --HubRequest{unregister}--> hub   on shutdown, with the reason
syntax = "proto3";

package forge.v1;

option cc_enable_arenas = true;

// Restart policy of an application's systemd unit (Restart=, StartLimitBurst=,
// StartLimitIntervalSec=, RestartSec=, WatchdogSec=), as the hub reads it.
message RestartPolicy {
  enum Mode {
    MODE_UNSPECIFIED = 0;
    MODE_NEVER = 1;       // Restart=no
    MODE_ON_FAILURE = 2;  // Restart=on-failure (and on-abnormal, on-watchdog, on-abort)
    MODE_ALWAYS = 3;      // Restart=always
  }
  Mode mode = 1;
  uint32 max_restarts = 2;  // within window_s, then the unit fails (0 = unlimited)
  uint32 window_s = 3;
  uint32 delay_s = 4;
  reserved 5;
  uint32 watchdog_s = 6;    // a hung main loop is killed and restarted after this (0 = off)
  string restart = 7;       // Restart= as systemd reports it
}

message AppRegistration {
  string name = 1;
  string version = 2;
  string description = 3;
  uint32 pid = 4;
  uint32 http_port = 5;               // 0 = no web interface
  map<string, string> endpoints = 6;  // control, events, data, telnet (as the application binds them)
  reserved 7;                         // was: RestartPolicy (now in the systemd unit)
  string group = 8;                   // dashboard grouping (optional)
  string title = 9;                   // display name (default: name)
  string unit = 10;                   // systemd unit the application says it runs in (informational)
  string forgecpp = 11;               // framework version
  bool critical = 12;                 // its unit failing is a critical alarm on the hub
  // Instance of an application that runs several times (systemd template unit
  // <name>@<instance>.service); then `name` is "<name>@<instance>".
  string instance = 13;
}

message Unregister {
  enum Reason {
    REASON_UNSPECIFIED = 0;
    REASON_SIGNAL = 1;  // asked to stop (SIGTERM, SIGINT, systemctl stop)
    REASON_EXIT = 2;    // the application ended on its own (exit_code)
  }
  string name = 1;
  uint32 pid = 2;
  Reason reason = 3;
  int32 exit_code = 4;
}

message HubRequest {
  oneof kind {
    AppRegistration register = 1;
    Unregister unregister = 2;
  }
}

message HubReply {
  bool ok = 1;
  string error = 2;
  string hub = 3;       // hub name and version
  string instance = 4;  // changes when the hub restarts
}

// Status of one application as the hub sees it (stream "apps", /api/apps).
message AppStatus {
  enum State {
    STATE_UNSPECIFIED = 0;
    STATE_RUNNING = 1;
    STATE_STARTING = 2;      // systemd is (re)starting it
    STATE_STOPPED = 3;       // stopped on request or exited cleanly
    STATE_CRASHED = 4;       // ended without unregistering (not a systemd unit: not restarted)
    STATE_FAILED = 5;        // the unit failed: too many restarts, or it cannot start
    STATE_UNRESPONSIVE = 6;  // process alive, health checks failing
    STATE_UNKNOWN = 7;       // known from an earlier boot, not running since
  }
  AppRegistration app = 1;
  State state = 2;
  string message = 3;           // why it is in this state
  string health = 4;            // ok | degraded | failed (the application's own view)
  uint32 alarms_active = 5;
  string alarms_highest = 6;    // severity of the most important active alarm
  uint64 uptime_s = 7;
  double cpu_percent = 8;
  uint64 rss_bytes = 9;
  uint32 restarts = 10;         // systemd's NRestarts (automatic restarts since the unit was started)
  reserved 11;
  string supervision = 12;      // "systemd <unit>" or "none"
  int64 last_seen_unix_ms = 13; // last successful health check or registration
  string url = 14;              // static entries: page URL ("{host}" = the address the browser used)
  bool static_entry = 15;       // from the hub's configuration, not registered
  RestartPolicy policy = 16;    // the unit's restart policy
  string unit_state = 17;       // systemd ActiveState/SubState, e.g. "active/running", "failed/failed"
  string unit_result = 18;      // systemd Result of the last run, e.g. "exit-code", "watchdog", "start-limit-hit"
}

message AppList {
  repeated AppStatus apps = 1;
  string hub = 2;
  string boot_id = 3;
}
