// forge.v1 observability messages: alarms, logs, audit, metrics, health, trace.
syntax = "proto3";

package forge.v1;

import "forge/v1/common.proto";
import "google/protobuf/struct.proto";

option cc_enable_arenas = true;

message Alarm {
  string id = 1;
  Severity severity = 2;
  string message = 3;
  bool active = 4;
  bool acknowledged = 5;
  string acknowledged_by = 6;
  uint64 count = 7;
  int64 raised_unix_ms = 8;
  int64 last_unix_ms = 9;
  int64 cleared_unix_ms = 10;       // 0 = not cleared
  int64 acknowledged_unix_ms = 11;  // 0 = not acknowledged
}

message AlarmList {
  repeated Alarm alarms = 1;
}

message LogRecord {
  int64 time_unix_ns = 1;
  string level = 2;    // trace|debug|info|warn|error|critical
  string logger = 3;
  string message = 4;
  uint64 thread = 5;
  TraceContext trace = 6;
}

message LogList {
  repeated LogRecord records = 1;
}

// Who changed what, when, from where: every set / press / call / ack / lease.
message AuditRecord {
  int64 time_unix_ns = 1;
  string channel = 2;   // web | zmq | console | telnet | http-rpc | internal
  string client = 3;    // address or client name
  string user = 4;      // authenticated user, if any
  string action = 5;    // set | press | call | ack | lease | release | log-level | reload
  string target = 6;    // control / command / alarm id
  google.protobuf.Value old_value = 7;
  google.protobuf.Value new_value = 8;
  bool ok = 9;
  string error = 10;
  TraceContext trace = 11;
}

message AuditList {
  repeated AuditRecord records = 1;
}

message Metric {
  enum Type {
    TYPE_UNSPECIFIED = 0;
    TYPE_COUNTER = 1;
    TYPE_GAUGE = 2;
    TYPE_HISTOGRAM = 3;
  }
  string name = 1;
  string help = 2;
  Type type = 3;
  string unit = 4;
  double value = 5;             // counter / gauge
  repeated double bounds = 6;   // histogram upper bounds (le)
  repeated uint64 buckets = 7;  // histogram counts per bound, cumulative; last = +Inf
  uint64 count = 8;             // histogram observations
  double sum = 9;
  map<string, string> labels = 10;
}

message MetricsSnapshot {
  int64 time_unix_ns = 1;
  repeated Metric metrics = 2;
}

message ComponentHealth {
  enum State {
    STATE_UNSPECIFIED = 0;
    STATE_OK = 1;
    STATE_DEGRADED = 2;
    STATE_FAILED = 3;
  }
  string name = 1;
  State state = 2;
  string message = 3;
  bool critical = 4;  // a failed critical component stops the systemd watchdog
  int64 since_unix_ms = 5;
}

message Health {
  ComponentHealth.State state = 1;  // worst of the components
  repeated ComponentHealth components = 2;
}

// Flight recorder dump: Chrome trace-event JSON (open in ui.perfetto.dev).
message TraceDump {
  string chrome_json = 1;
  uint64 events = 2;
  uint64 dropped = 3;
}
