// forge.v1 - the message standard every forgecpp application speaks.
//
// One schema for all applications, so an engineer moving between systems,
// a remote control panel or a recorder needs no per-application protocol.
//
// On ZeroMQ every published message is multipart:
//   frame 0  topic   UTF-8 (PUB/SUB prefix filtering)
//   frame 1  Header  (this file)
//   frame 2  body    the message named in Header.type (serialized protobuf)
//   frame 3  blob    optional raw bytes (e.g. IQ samples), described by the body
// Requests and replies (control) are single frames: Request / Reply (control.proto).
syntax = "proto3";

package forge.v1;

import "google/protobuf/struct.proto";

option cc_enable_arenas = true;

// Trace context (W3C trace-context sizes): carried in headers and requests so
// one operation can be followed across applications.
message TraceContext {
  bytes trace_id = 1;  // 16 bytes
  bytes span_id = 2;   // 8 bytes
}

message Header {
  string source = 1;        // application name
  string host = 2;
  uint32 pid = 3;
  string topic = 4;
  uint64 seq = 5;           // per topic, +1 per message: a gap means messages were dropped
  int64 time_unix_ns = 6;
  string type = 7;          // full name of the body message, e.g. "radio.v1.IqBlock"
  TraceContext trace = 8;
  map<string, string> attributes = 9;
}

enum Severity {
  SEVERITY_UNSPECIFIED = 0;
  SEVERITY_INFO = 1;
  SEVERITY_WARNING = 2;
  SEVERITY_ERROR = 3;
  SEVERITY_CRITICAL = 4;
}

// Control values are dynamic (number, bool, text, list): google.protobuf.Value.
message Values {
  map<string, google.protobuf.Value> values = 1;
}
