// spectrum-analyzer messages (stream "spectrum" on [forge].data).
syntax = "proto3";

package sa.v1;

option cc_enable_arenas = true;

// One sweep of the live trace: levels[i] is at
// start_hz + i * (stop_hz - start_hz) / (points - 1).
message Spectrum {
  uint64 seq = 1;              // analyzer sweep counter
  double start_hz = 2;
  double stop_hz = 3;
  uint32 points = 4;
  string unit = 5;             // dBFS | dBm
  double rbw_hz = 6;           // resolution bandwidth actually used
  string sweep_mode = 7;       // realtime | swept | fixed (radio-controller's band)
  bool overload = 8;           // ADC clipping during this sweep
  double sweep_time_s = 9;
  uint32 channel = 10;         // RX channel (1, 2)
  repeated float levels = 11;  // live trace in `unit`
}
