// AD936x sample streams. Each ZeroMQ message is
// [topic][forge.stream_header][body][blob]; the samples are the blob.
//
//   topic "iq"           iq_block + blob: every buffer of the channels radio-controller listens to
//   topic "rx1" / "rx2"  iq_block + blob: shared channels ([radio].tap_rx), rate limited, latest only
//   TX input (PUSH to [zmq].tx): tx_block + blob
syntax = "proto3";

import "nanopb.proto";

package radio;

message iq_block {
    uint32 channel = 1;                         // 1 = RX1, 2 = RX2
    double sample_rate = 2;                     // Hz
    double center_freq = 3;                     // RX LO, Hz
    uint32 samples = 4;                         // complex samples in the blob
    string format = 5 [(nanopb).max_size = 8];  // "cs16": interleaved little-endian int16 I/Q, full scale +-32767
    double rx_gain_db = 6;                      // gain of this channel when the block was taken
    uint64 buffer = 7;                          // DMA buffer counter (gaps = buffers not sent)
}

message tx_block {
    string format = 1 [(nanopb).max_size = 8];  // "cs16"
    bool cyclic = 2;                            // repeat this frame until stopped (test tones, beacons)
}
