<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Thermostat – Settings</title>
  <link rel="icon" href="assets/favicon.svg" type="image/svg+xml">
  <link rel="stylesheet" href="forge/forge.css">
  <link rel="stylesheet" href="assets/site.css">
  <script src="forge/forge.js"></script>
  <script src="assets/settings.js" defer></script>
</head>
<body class="forge">
  <header class="forge-header">
    <div class="forge-brand">
      <span class="forge-dot" data-forge-connection></span>
      <h1>Thermostat</h1>
    </div>
    <nav class="nav">
      <a href="./">Overview</a>
      <a href="settings.html" class="current">Settings</a>
      <a href="forge/">Control panel</a>
    </nav>
    <div class="forge-alarms-host" data-forge-alarms></div>
  </header>

  <main class="forge-main">
    <form class="forge-card form" id="settings" novalidate>
      <h2>Settings</h2>
      <div class="field">
        <label for="room">Room name</label>
        <input id="room" name="room" type="text" maxlength="40" required>
      </div>
      <div class="field">
        <label for="hysteresis">Hysteresis</label>
        <input id="hysteresis" name="hysteresis" type="number" step="0.1" min="0.1" max="2">
        <span class="hint">°C around the setpoint before heating/cooling switches (0.1 – 2.0)</span>
      </div>
      <div class="field">
        <label for="min_setpoint">Minimum setpoint</label>
        <input id="min_setpoint" name="min_setpoint" type="number" step="0.5" min="5" max="25">
      </div>
      <div class="field">
        <label for="max_setpoint">Maximum setpoint</label>
        <input id="max_setpoint" name="max_setpoint" type="number" step="0.5" min="15" max="35">
      </div>
      <div class="field">
        <label for="high_alarm">High temperature alarm</label>
        <input id="high_alarm" name="high_alarm" type="number" step="0.5" min="20" max="45">
        <span class="hint">°C; a warning alarm is raised above this temperature</span>
      </div>
      <div class="form-actions">
        <button type="reset" class="forge-btn">Revert</button>
        <button type="submit" class="forge-btn primary">Save</button>
      </div>
    </form>
  </main>
</body>
</html>
