# radio-controller configuration
# Reload with: systemctl reload radio-controller   (or kill -HUP <pid>)

[radio]
backend = "sim"               # sim | iio  (also: --backend)
uri = ""                      # iio: "local:" (on the board), "ip:192.168.2.1", "usb:1.2.5"; "" = libiio default
timeout_ms = 2000

# Channel roles: set them to what the transceiver has (AD9364: RX1/TX1 only;
# AD9361/AD9363 in 2R2T mode: RX1, RX2, TX1, TX2). A role the hardware cannot
# do raises the radio.device alarm with the reason. Fixed until the next start.
rx_channels = [1]             # RX channels it listens to: IQ stream on [zmq].rx ("channel" in the header)
tx_channel = 1                # TX channel it drives from [zmq].tx
tap_rx = [2]                  # RX channels it shares on [zmq].tap (topics "rx1", "rx2"): e.g. the spectrum analyzer
tap_samples = 65536           # samples per shared block, at most buffer_size (= the analyzer's largest FFT)
tap_hz = 20                   # shared blocks per second (0 = every buffer)

buffer_size = 65536           # samples per RX/TX DMA buffer
rx_enabled = true
tx_enabled = false

rx_lo_hz = 2412000000
tx_lo_hz = 2412000000
sample_rate_hz = 30720000     # 2.083334 .. 61.44 MSPS
rx_bandwidth_hz = 18000000
tx_bandwidth_hz = 18000000
# LO, sample rate and bandwidth are shared by both RX (and both TX) channels;
# gain is per channel.
gain_mode = "slow_attack"     # RX1: manual | slow_attack | fast_attack | hybrid
rx_gain_db = 30               # RX1, used in manual gain mode
rx2_gain_mode = "slow_attack" # RX2 (AD9361/AD9363)
rx2_gain_db = 30
tx_attenuation_db = 10        # of tx_channel: 0 .. 89.75

state_file = ""               # e.g. "/var/lib/radio-controller/state.json": keep runtime changes across restarts
spectrum_size = 1024          # FFT size for the web spectrum
spectrum_hz = 5
temperature_alarm_c = 75

[radio.sim]
channels = 2                  # 1 = AD9364 (1R1T), 2 = AD9361 (2R2T)
loopback = true               # a simulated cable: TX samples appear in RX (shifted by TX LO - RX LO)
loopback_tx = 1               # cable from TX1 ...
loopback_rx = 2               # ... to RX2

[zmq]
rx = "tcp://*:5555"           # PUB: topic "iq", header JSON + cs16 samples
tx = "tcp://*:5556"           # PULL: header JSON + cs16 samples ({"cyclic": true} repeats the frame)
control = "tcp://*:5557"      # REP: JSON commands
tap = "tcp://*:5558"          # PUB: topics "rx1"/"rx2", blocks of the tap_rx channels

[http]
enabled = true
host = "0.0.0.0"
port = 8080

# [http.auth]
# user = "admin"
# password = "change-me"

[web]
title = "Radio controller"
refresh_ms = 250
