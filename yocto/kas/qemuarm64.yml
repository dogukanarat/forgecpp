# The image of qemuarm64-poky.yml, in a build that also has meta-oe and
# meta-python, as most BSPs do: then their recipes of zeromq, protobuf, ...
# are used and the layer's backfill recipes are not.
#
#   FORGECPP_SRC=$PWD kas build yocto/kas/qemuarm64.yml                 # image
#   FORGECPP_SRC=$PWD kas build yocto/kas/qemuarm64.yml -c testimage    # boot it in QEMU and test
#
# Used by .github/workflows/yocto.yml (weekly) and yocto-check.yml (bitbake -n).
header:
  version: 14
  includes:
    - yocto/kas/qemuarm64-poky.yml   # kas: relative to the repository root

repos:
  meta-openembedded:
    url: https://github.com/openembedded/meta-openembedded
    branch: scarthgap
    layers:
      meta-oe:
      meta-python:
