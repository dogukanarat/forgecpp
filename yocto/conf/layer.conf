# meta-forgecpp: forgecpp, forge-hub, the example applications, and every
# library forgecpp needs. Use this directory as a layer (bblayers.conf / kas):
# with poky (oe-core) alone it builds everything.
BBPATH .= ":${LAYERDIR}"
BBFILES += "${LAYERDIR}/recipes-*/*/*.bb ${LAYERDIR}/recipes-*/*/*.bbappend"

BBFILE_COLLECTIONS += "forgecpp"
BBFILE_PATTERN_forgecpp = "^${LAYERDIR}/"
BBFILE_PRIORITY_forgecpp = "6"

# Only oe-core: SQLite (sqlite3), LZ4 (lz4), OpenSSL, zlib, libxml2 come from
# it. quill, cpp-httplib, concurrentqueue, tomlplusplus and doctest are in no
# other layer: their recipes are always this layer's. The libraries of meta-oe
# and meta-python that forgecpp needs (zeromq, cppzmq, nlohmann-json, cli11,
# libiio, protobuf, python3-protobuf) have recipes here too, in backfill/, at
# the versions of forgecpp's submodules. They are used only when that layer is NOT in the
# build ("!" in BBFILES_DYNAMIC, bitbake 2.8 / scarthgap): a BSP with meta-oe
# keeps its own versions, nothing is built twice and nothing is replaced.
LAYERDEPENDS_forgecpp = "core"
LAYERRECOMMENDS_forgecpp = "openembedded-layer meta-python"
BBFILES_DYNAMIC += " \
    !openembedded-layer:${LAYERDIR}/backfill/meta-oe/recipes-*/*/*.bb \
    !meta-python:${LAYERDIR}/backfill/meta-python/recipes-*/*/*.bb \
"
# The release kas/qemuarm64.yml builds. The recipes are written to work on
# styhead and walnascar too (FORGECPP_UNPACKDIR below); add a series here once
# a build of it has passed.
LAYERSERIES_COMPAT_forgecpp = "scarthgap"

# Where the fetcher unpacks: ${WORKDIR} up to scarthgap, ${UNPACKDIR} from
# styhead on (scarthgap does not define it). The recipes of this layer use
# S = "${FORGECPP_UNPACKDIR}/git".
FORGECPP_UNPACKDIR = "${@d.getVar('UNPACKDIR') or d.getVar('WORKDIR')}"
