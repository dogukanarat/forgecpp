# forge-hub configuration (forge-hub --help-config lists every key)
#
# Applications register themselves ([hub] in their own configuration); this
# file only configures the hub. Restarting applications is systemd's job (their
# units, generated by forge_add_app); the hub shows it and starts / stops /
# restarts units on request.

[http]
enabled = true
host = "0.0.0.0"
port = 80                       # http://<device>/ (needs root or CAP_NET_BIND_SERVICE)

[web]
title = "Device"
logs = true

[registry]
listen = "tcp://127.0.0.1:5550" # applications register here; keep it on localhost
state_file = "/var/lib/forge-hub/registry.json"  # remembered across hub restarts
probe_interval_ms = 2000        # health checks (GET /health of each application) and systemd queries
probe_timeout_ms = 1500
unresponsive_after_s = 5
systemd = true                  # follow the applications' units (state, restarts, policy, actions)

# Applications that do not register (other web interfaces on the device):
# [static.camera]
# title = "Camera"
# url = "http://{host}:8554/"   # {host} = the address the browser used
# health_url = "http://127.0.0.1:8554/health"
# description = "RTSP camera server"
# group = "Video"

# forge.v1: the hub is a forgecpp application too (forgectl, panels)
[forge]
control = "tcp://*:5551"        # forgectl -e tcp://<device>:5551 call restart name=<app>
events = "tcp://*:5552"         # alarms (crashes, restarts given up), state
data = "tcp://*:5553"           # stream "apps" (forge.v1.AppList)

[console]
telnet = ""                     # e.g. "0.0.0.0:2300" for a remote console

# Strongly recommended on fielded devices: viewers see, operators restart/stop.
# [auth]
# enabled = true
# default_role = "viewer"
# [auth.users.admin]
# password = "change-me"
# role = "admin"

[log]
level = "info"
