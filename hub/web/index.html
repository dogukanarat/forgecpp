<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Device</title>
  <link rel="stylesheet" href="/forge/forge.css">
  <link rel="stylesheet" href="hub.css">
  <script src="/forge/forge.js"></script>
  <script src="hub.js" defer></script>
</head>
<body class="forge">
  <header class="forge-header">
    <div class="forge-brand">
      <span class="forge-dot" data-forge-connection></span>
      <h1 id="hub-title">Device</h1>
    </div>
    <nav><a href="/forge/">Hub control panel</a>
      <button type="button" class="forge-layout-reset" data-forge-layout-reset
              title="Cards can be moved by their header and resized from their corner">Reset layout</button></nav>
    <div class="forge-meta"><span id="hub-host"></span><span id="hub-version"></span></div>
    <div class="forge-alarms-host" data-forge-alarms></div>
  </header>

  <main class="forge-main">
    <div class="hub-summary" id="hub-summary" aria-live="polite"></div>
    <div class="forge-empty" id="hub-error" hidden></div>
    <div class="forge-empty" id="hub-empty" hidden>No applications have registered yet. forgecpp applications
      register by themselves when they start ([hub] in their configuration); others can be listed under
      [static.&lt;name&gt;] in the hub's configuration.</div>
    <div id="hub-apps"></div>
  </main>
</body>
</html>
